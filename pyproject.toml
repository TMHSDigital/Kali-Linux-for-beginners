# Tooling config only; the scripts are standard-library Python with no install step.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# The scripts keep their one-line Palette helpers and typing.List style for 3.7+.
ignore = ["E701", "UP006", "UP007", "UP035", "UP045"]
