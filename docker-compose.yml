# =============================================================================
# Kali Linux for Beginners: Practice Target Lab
# =============================================================================
# Spins up deliberately insecure services on a private, static bridge network so
# you can practice host discovery, port scanning, cleartext-credential
# interception, and packet analysis SAFELY against targets you own.
#
#   attacker     10.77.0.5    Kali toolbox ON the lab network (nmap, tshark, ftp, curl)
#   web-target   10.77.0.10   HTTP login form (POST creds in cleartext)
#   ftp-service  10.77.0.20   vsftpd with anonymous + local login (cleartext)
#
# Bring up:   ./scripts/setup-lab-env.sh      (or: docker compose up -d --build)
# Get a shell on the attacker:  ./scripts/setup-lab-env.sh shell
# Tear down:  docker compose down
#
# Network exposure: published ports bind to 127.0.0.1 only, so nothing is
# reachable from other machines. The containers DO have outbound internet
# access (Docker cannot publish ports from an `internal` network). Never change
# the port bindings to 0.0.0.0 and only scan the 10.77.0.0/24 range.
# =============================================================================

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------------------
  # attacker: run the curriculum's commands from here. It works identically on
  # Linux, Docker Desktop (Windows/macOS), WSL2, and Codespaces.
  # ---------------------------------------------------------------------------
  attacker:
    build: ./lab/attacker
    image: kali-beginners/attacker:local
    container_name: attacker
    hostname: attacker
    restart: unless-stopped
    init: true
    networks:
      pentest-lab-net:
        ipv4_address: 10.77.0.5
    # Raw sockets for SYN/OS scans and packet capture on its own interface.
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./:/lab:ro
      - ./workspace:/root/work

  # ---------------------------------------------------------------------------
  # web-target: nginx serving a plain HTTP login form. Submitting the form POSTs
  # username/password in cleartext so you can intercept them with Wireshark /
  # tshark (module 05) and see why HTTP-without-TLS is a credential leak.
  # ---------------------------------------------------------------------------
  web-target:
    <<: *hardening
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    container_name: web-target
    hostname: web-target
    restart: unless-stopped
    networks:
      pentest-lab-net:
        ipv4_address: 10.77.0.10
    ports:
      # Exposed on the host loopback only, so you can browse the form locally.
      - "127.0.0.1:8080:80"
    volumes:
      - ./lab/web-target/index.html:/usr/share/nginx/html/index.html:ro
      - ./lab/web-target/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Assert on the lab page itself, not just "nginx answers".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q 'ACME Intranet'"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ftp-service: vsftpd with anonymous AND local logins. FTP authentication and
  # data are unencrypted, so USER/PASS and directory listings are trivially
  # recoverable from a capture; the classic "why not plain FTP" case.
  # ---------------------------------------------------------------------------
  ftp-service:
    <<: *hardening
    build: ./lab/ftp-service
    image: kali-beginners/ftp-service:local
    container_name: ftp-service
    hostname: ftp-service
    restart: unless-stopped
    networks:
      pentest-lab-net:
        ipv4_address: 10.77.0.20
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:21100-21110:21100-21110"
    environment:
      # A named local user so you can practice authenticated (still cleartext) login.
      FTP_USER: "labuser"
      FTP_PASS: "labpass"

# -----------------------------------------------------------------------------
# Bridge with a predictable, static /24 so scan targets never move. A /24 is
# all the lab needs and is far less likely to collide with VPNs or other
# compose projects than a /16.
# -----------------------------------------------------------------------------
networks:
  pentest-lab-net:
    name: pentest-lab-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.77.0.0/24
          gateway: 10.77.0.1
    driver_opts:
      com.docker.network.bridge.name: br-pentestlab
