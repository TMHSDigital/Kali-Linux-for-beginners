@keyframes a24{0%,71.966%{opacity:0}71.972%,100%{opacity:1}}.l24{animation:a24 18.80s linear infinite}
@keyframes a25{0%,72.445%{opacity:0}72.450%,100%{opacity:1}}.l25{animation:a25 18.80s linear infinite}
