<svg xmlns="http://www.w3.org/2000/svg" width="780" height="573" viewBox="0 0 780 573" role="img" aria-labelledby="t d">
<title id="t">Terminal demo: attacker (10.77.0.5): scan, capture, and read a cleartext FTP login in the practice lab</title>
<desc id="d">In the attacker shell, nmap finds HTTP on 10.77.0.10 and FTP on 10.77.0.20. tshark captures an FTP login made with curl, then reads the username labuser and password labpass back out of the capture.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,"Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
@keyframes a0{0%,5.851%{opacity:0}5.857%,100%{opacity:1}}.l0{animation:a0 18.80s linear infinite}
@keyframes a1{0%,8.511%{opacity:0}8.516%,100%{opacity:1}}.l1{animation:a1 18.80s linear infinite}
@keyframes c1{0%,8.511%{transform:translateX(0)}11.585%,100%{transform:translateX(206.8px)}}.c1{animation:c1 18.80s steps(26) infinite}
@keyframes a2{0%,14.244%{opacity:0}14.250%,100%{opacity:1}}.l2{animation:a2 18.80s linear infinite}
@keyframes a3{0%,14.723%{opacity:0}14.728%,100%{opacity:1}}.l3{animation:a3 18.80s linear infinite}
@keyframes a4{0%,15.202%{opacity:0}15.207%,100%{opacity:1}}.l4{animation:a4 18.80s linear infinite}
@keyframes a6{0%,15.947%{opacity:0}15.952%,100%{opacity:1}}.l6{animation:a6 18.80s linear infinite}
@keyframes a7{0%,16.425%{opacity:0}16.431%,100%{opacity:1}}.l7{animation:a7 18.80s linear infinite}
@keyframes a8{0%,16.904%{opacity:0}16.909%,100%{opacity:1}}.l8{animation:a8 18.80s linear infinite}
@keyframes a10{0%,17.649%{opacity:0}17.654%,100%{opacity:1}}.l10{animation:a10 18.80s linear infinite}
@keyframes a12{0%,21.053%{opacity:0}21.059%,100%{opacity:1}}.l12{animation:a12 18.80s linear infinite}
@keyframes a13{0%,23.713%{opacity:0}23.718%,100%{opacity:1}}.l13{animation:a13 18.80s linear infinite}
@keyframes c13{0%,23.713%{transform:translateX(0)}29.624%,100%{transform:translateX(394.0px)}}.c13{animation:c13 18.80s steps(50) infinite}
@keyframes a14{0%,32.283%{opacity:0}32.289%,100%{opacity:1}}.l14{animation:a14 18.80s linear infinite}
@keyframes a15{0%,32.762%{opacity:0}32.767%,100%{opacity:1}}.l15{animation:a15 18.80s linear infinite}
@keyframes a16{0%,33.241%{opacity:0}33.246%,100%{opacity:1}}.l16{animation:a16 18.80s linear infinite}
@keyframes c16{0%,33.241%{transform:translateX(0)}38.087%,100%{transform:translateX(323.8px)}}.c16{animation:c16 18.80s steps(41) infinite}
@keyframes a17{0%,40.747%{opacity:0}40.752%,100%{opacity:1}}.l17{animation:a17 18.80s linear infinite}
@keyframes a18{0%,41.226%{opacity:0}41.231%,100%{opacity:1}}.l18{animation:a18 18.80s linear infinite}
@keyframes c18{0%,41.226%{transform:translateX(0)}43.088%,100%{transform:translateX(58.6px)}}.c18{animation:c18 18.80s steps(7) infinite}
@keyframes a19{0%,45.747%{opacity:0}45.753%,100%{opacity:1}}.l19{animation:a19 18.80s linear infinite}
@keyframes a21{0%,49.152%{opacity:0}49.157%,100%{opacity:1}}.l21{animation:a21 18.80s linear infinite}
@keyframes a22{0%,51.812%{opacity:0}51.817%,100%{opacity:1}}.l22{animation:a22 18.80s linear infinite}
@keyframes c22{0%,51.812%{transform:translateX(0)}60.559%,100%{transform:translateX(581.2px)}}.c22{animation:c22 18.80s steps(74) infinite}
