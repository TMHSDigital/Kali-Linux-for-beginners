</style>
<rect x="0.5" y="0.5" width="779" height="572" rx="10" fill="#0c1118" stroke="#222b38"/>
<path d="M0.5 32V10.5a10 10 0 0 1 10-10h759a10 10 0 0 1 10 10V32z" fill="#10151d"/>
<line x1="0.5" y1="32" x2="779.5" y2="32" stroke="#222b38"/>
<circle cx="20" cy="16.0" r="5" fill="#3a4556"/><circle cx="37" cy="16.0" r="5" fill="#3a4556"/><circle cx="54" cy="16.0" r="5" fill="#3a4556"/>
<text x="390.0" y="20.0" fill="#7d8a99" text-anchor="middle" font-size="12">attacker (10.77.0.5) - Kali practice lab</text>
<text class="l0" x="18" y="62" fill="#7d8a99" xml:space="preserve"># 1. Find what is running on the lab network</text>
<text class="l1" x="18" y="81" fill="#e6edf3" xml:space="preserve"><tspan fill="#3fb950">root@attacker:~#</tspan> nmap 10.77.0.10 10.77.0.20</text>
<rect class="c1 cover" x="150.6" y="68" width="208.8" height="19" fill="#0c1118"/>
<text class="l2" x="18" y="100" fill="#e6edf3" xml:space="preserve">Nmap scan report for web-target.pentest-lab-net (10.77.0.10)</text>
<text class="l3" x="18" y="119" fill="#e6edf3" xml:space="preserve">PORT   STATE SERVICE</text>
<text class="l4" x="18" y="138" fill="#36c5f0" xml:space="preserve">80/tcp open  http</text>
<text class="l6" x="18" y="176" fill="#e6edf3" xml:space="preserve">Nmap scan report for ftp-service.pentest-lab-net (10.77.0.20)</text>
<text class="l7" x="18" y="195" fill="#e6edf3" xml:space="preserve">PORT   STATE SERVICE</text>
<text class="l8" x="18" y="214" fill="#36c5f0" xml:space="preserve">21/tcp open  ftp</text>
<text class="l10" x="18" y="252" fill="#e6edf3" xml:space="preserve">Nmap done: 2 IP addresses (2 hosts up) scanned in 0.16 seconds</text>
<text class="l12" x="18" y="290" fill="#7d8a99" xml:space="preserve"># 2. Capture an FTP login while it happens</text>
<text class="l13" x="18" y="309" fill="#e6edf3" xml:space="preserve"><tspan fill="#3fb950">root@attacker:~#</tspan> tshark -i eth0 -f &quot;tcp port 21&quot; -w ftp.pcapng -q &amp;</text>
<rect class="c13 cover" x="150.6" y="296" width="396.0" height="19" fill="#0c1118"/>
<text class="l14" x="18" y="328" fill="#e6edf3" xml:space="preserve">[1] 92</text>
<text class="l15" x="18" y="347" fill="#e6edf3" xml:space="preserve">Capturing on &#x27;eth0&#x27;</text>
<text class="l16" x="18" y="366" fill="#e6edf3" xml:space="preserve"><tspan fill="#3fb950">root@attacker:~#</tspan> curl -s ftp://labuser:labpass@10.77.0.20/</text>
<rect class="c16 cover" x="150.6" y="353" width="325.8" height="19" fill="#0c1118"/>
<text class="l17" x="18" y="385" fill="#e6edf3" xml:space="preserve">-rw-r--r--    1 1000     1000           72 Nov 21 10:24 notes.txt</text>
<text class="l18" x="18" y="404" fill="#e6edf3" xml:space="preserve"><tspan fill="#3fb950">root@attacker:~#</tspan> kill %1</text>
<rect class="c18 cover" x="150.6" y="391" width="60.6" height="19" fill="#0c1118"/>
<text class="l19" x="18" y="423" fill="#e6edf3" xml:space="preserve">28 packets captured</text>
<text class="l21" x="18" y="461" fill="#7d8a99" xml:space="preserve"># 3. Read the username and password out of the capture</text>
<text class="l22" x="18" y="480" fill="#e6edf3" xml:space="preserve"><tspan fill="#3fb950">root@attacker:~#</tspan> tshark -r ftp.pcapng -T fields -e ftp.request.command -e ftp.request.arg \</text>
<rect class="c22 cover" x="150.6" y="467" width="583.2" height="19" fill="#0c1118"/>
<text class="l23" x="18" y="499" fill="#e6edf3" xml:space="preserve"><tspan fill="#7d8a99">&gt;</tspan>   -Y &#x27;ftp.request.command==&quot;USER&quot; || ftp.request.command==&quot;PASS&quot;&#x27;</text>
<rect class="c23 cover" x="33.6" y="486" width="513.0" height="19" fill="#0c1118"/>
<text class="l24" x="18" y="518" fill="#f2a33a" font-weight="700" xml:space="preserve">USER    labuser</text>
<text class="l25" x="18" y="537" fill="#f2a33a" font-weight="700" xml:space="preserve">PASS    labpass</text>
<text class="l26" x="18" y="556" fill="#e6edf3" xml:space="preserve"><tspan fill="#3fb950">root@attacker:~#</tspan> </text>
<rect class="l26 cursor" x="150.6" y="544" width="7.8" height="16" fill="#e6edf3"/>
</svg>
