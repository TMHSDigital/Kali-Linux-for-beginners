# vsftpd config for the INSECURE practice lab. Do not reuse anywhere real.
listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO

# Anonymous logins (user "anonymous" or "ftp", any password), read-only.
anonymous_enable=YES
anon_root=/srv/ftp
no_anon_password=YES
ftp_username=ftp
anon_upload_enable=NO
anon_mkdir_write_enable=NO

# Local user logins (labuser/labpass by default), jailed to their home.
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive mode. No pasv_address is set, so vsftpd advertises the address the
# client connected to (10.77.0.20 for clients on the lab network). Host-side
# clients going through 127.0.0.1:2121 should ignore the advertised IP, e.g.
#   curl --ftp-skip-pasv-ip ftp://labuser:labpass@127.0.0.1:2121/
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

dirmessage_enable=YES
ftpd_banner=ACME FTP (lab target, cleartext on purpose)
# Transfer log stays inside the container (/var/log/vsftpd.log).
xferlog_enable=YES
xferlog_std_format=NO
