server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Echo a confirmation for the POSTed credentials so the request body is
  # obvious on the wire. nginx answers the POST here without touching disk.
  location = /login {
    default_type text/html;
    return 200 '<h1>Received (lab)</h1><p>Your credentials just crossed the network in cleartext. Go find them in Wireshark.</p>';
  }
}
